<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atalaya · Panel técnico de acciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/*CSS*/</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="bar">
      <span class="brand">Atalaya</span>
      <div class="search"><input id="q" type="search" placeholder="Buscar ticker o nombre  ( / )" autocomplete="off" aria-label="Buscar ticker"><div id="sugg"></div></div>
      <span class="sim" id="asof">Datos simulados</span>
      <button class="ghost" data-act="theme" aria-label="Cambiar tema">Tema</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  </header>
  <div id="filters"></div>
  <main id="main"></main>
  <p class="disc">Herramienta de screening y análisis, no de recomendación. <span id="foot"></span></p>
</div>
<script>/*JS*/</script>
</body>
