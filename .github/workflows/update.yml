name: Actualizar datos y publicar
on:
  schedule:
    - cron: '30 22 * * 1-5'   # lunes a viernes, 22:30 UTC (después del cierre de EE. UU.)
  workflow_dispatch:           # botón "Run workflow" para correrlo a mano
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas lxml requests
      - id: week
        run: echo "w=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/profiles.json
          key: profiles-${{ steps.week.outputs.w }}
          restore-keys: profiles-
      - name: Descargar precios y perfiles
       run: python tools/build_data.py --index sp1500 --out site/data.json --profiles
      - name: Armar la página
        run: python build.py --out site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
